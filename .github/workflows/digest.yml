name: GitHub Trending DingTalk Digest

on:
  schedule:
    - cron: "50 15 * * 1-4"
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: Command to run
        required: true
        default: dry-run-weekly
        type: choice
        options:
          - dry-run-daily
          - dry-run-weekly
          - collect-daily
          - publish-auto

permissions:
  contents: write
  models: read

concurrency:
  group: github-trending-dingtalk
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODEL: ${{ vars.AI_MODEL }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled or manual command
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_COMMAND: ${{ inputs.command }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHEDULE" = "50 15 * * 1-4" ]; then
              npm run collect:daily
            else
              npm run publish:auto
            fi
          else
            case "$MANUAL_COMMAND" in
              dry-run-daily) npm run dry-run:daily ;;
              dry-run-weekly) npm run dry-run:weekly ;;
              collect-daily) npm run collect:daily ;;
              publish-auto) npm run publish:auto ;;
            esac
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "data: update digest state [skip ci]"
            git push
          fi
